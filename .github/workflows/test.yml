name: Test

on:
  push:
    branches: [main]
  pull_request:
    # ANY base, not just main. This filter matches the PR's BASE branch,
    # so `branches: [main]` silently gave zero CI to every stacked PR —
    # and GitHub renders "no checks reported" almost identically to a
    # passing run, so the gap reads as green rather than as absent.
    #
    # Stacking is normal here: the parallel-session rules put each piece
    # of work on its own worktree and branch, so a PR based on another
    # in-flight branch is the expected shape whenever two changes touch
    # the same files.
    #
    branches: ['**']
    # The second half of the same trap. When a base branch merges and is
    # deleted, GitHub RETARGETS the PRs stacked on it — so a PR that was
    # tested against its old base silently becomes a PR against `main`
    # that nothing has ever run on.
    #
    # There is no `base_changed` activity type; the retarget arrives as
    # `edited` with a `changes.base` payload, and `edited` is not in the
    # default set (`opened`, `synchronize`, `reopened`). Naming the types
    # explicitly is what closes it — and the default three must be listed
    # too, because supplying `types` REPLACES the default set rather than
    # adding to it. Dropping one here would trade this hole for a worse
    # one.
    types: [opened, synchronize, reopened, edited]

jobs:
  test:
    # `edited` also fires on every title and body edit, and PR bodies get
    # edited a lot — running the full suite for a typo fix is waste. Gate
    # on the payload instead: `changes.base` is present ONLY when the base
    # branch moved, which is the single case `edited` was added for.
    # Non-`edited` events (push, opened, synchronize, reopened) short-
    # circuit on the first clause and are unaffected.
    # `smoke-pg` needs this job, so skipping here skips both.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    # `manage.py check` and `collectstatic` load cimweb.settings — the
    # PRODUCTION module — and DEBUG defaults to False there, so the
    # insecure-key guard refuses to boot without this. A CI runner is a
    # build box, not a deploy, so it supplies a throwaway key rather than
    # the guard learning to look the other way. Same move
    # scripts/smoke_pg_django.py already makes for the Postgres job, and
    # cimweb/settings_test.py for pytest.
    #
    # The key is padded past 50 characters because `check --deploy` below
    # raises security.W009 for anything shorter. W009 is satisfied rather
    # than silenced, because silencing it in settings.py would silence it
    # everywhere — including for a genuinely weak key someone sets later.
    # What W009 does NOT do is vet production: nothing in the deploy path
    # runs `check --deploy` (Render's build is pip/collectstatic/migrate),
    # so in this pipeline W009 only ever sees this throwaway key. See the
    # SILENCED_SYSTEM_CHECKS note in cimweb/settings.py.
    env:
      DJANGO_SECRET_KEY: ci-only-key-never-deployed-padded-well-past-fifty-characters-for-w009
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Django checks
        run: python manage.py check && python manage.py makemigrations --check --dry-run

      # --fail-level WARNING: a NEW deploy warning fails the build instead
      # of scrolling past. The known-and-deliberate one (security.W021,
      # HSTS preload off on purpose) is silenced with a reason in
      # cimweb/settings.py SILENCED_SYSTEM_CHECKS; everything else that
      # ever appears here is a regression by definition. CI has no .env,
      # so DEBUG defaults False and this runs against the production
      # branch of the settings — no extra env needed.
      - name: Deploy checks (fail on new warnings)
        run: python manage.py check --deploy --fail-level WARNING

      - name: Collectstatic (whitenoise manifest build gate)
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python -m pytest tests/ -v

  # The investor summary's two-page guarantee is a CONTENT BUDGET, not a
  # page count — python-docx does not paginate, so every other test in
  # tests/test_investor_summary.py asserts the budget's own arithmetic and
  # none of them can notice that the arithmetic models the wrong thing.
  # `test_real_render_is_two_pages` is the only check that puts the
  # document through a real renderer, and it skipped everywhere, because
  # LibreOffice needs root to install and the dev box has no passwordless
  # sudo. A CI runner does. So the calibration runs HERE or nowhere.
  #
  # Its own job, not a step in `test`: the LibreOffice install costs ~60-90s
  # and would tax every run of a suite that does not need it. Parallel with
  # `test` rather than `needs:`-chained, because it validates typography and
  # has no dependency on the rest of the suite passing.
  page-budget:
    runs-on: ubuntu-latest
    env:
      # Turns the test's skip into a FAILURE. Without it an apt-get step
      # that silently installed nothing would leave the test skipping and
      # this job reporting green — a calibration check that validates
      # nothing while looking like it does.
      CIM_REQUIRE_SOFFICE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # libreoffice-writer, not libreoffice: the summary is a .docx and
      # the full suite pulls in Calc, Impress and Draw for nothing.
      # poppler-utils gives `pdfinfo`, which counts pages authoritatively
      # instead of scraping bytes for `/Type /Page`.
      - name: Install LibreOffice Writer and poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer poppler-utils fonts-crosextra-carlito
      # Carlito is Calibri's metric-compatible clone. Without it
      # LibreOffice substitutes a font with different advance widths and
      # the render disagrees with the budget for a reason that has
      # nothing to do with the calibration — see output/page_budget.py.
      - name: Confirm the toolchain is really present
        run: |
          soffice --version
          pdfinfo -v
          fc-match Calibri
      - run: pip install -r requirements.txt pytest
      - name: Re-validate the content budget against a real renderer
        run: python -m pytest tests/test_investor_summary.py -v -k "real_render or page_counter"

  smoke-pg:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/smoke_pg_django.py
