name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # Guards against the one silent failure in the hand-rebuilt CSS workflow:
      # a template class change that ships without re-running the Tailwind
      # build, leaving static/css/tw.css missing the new classes (elements then
      # render unstyled with no error anywhere). Rebuilds with the exact pinned
      # command documented in webapp/templates/base.html and fails on any drift.
      - name: Tailwind CSS is up to date
        run: |
          TAILWINDCSS_VERSION=v3.4.17 tailwindcss -c tailwind.config.js \
            -i static/src/input.css -o static/css/tw.css --minify
          git diff --exit-code static/css/tw.css || {
            echo "::error file=static/css/tw.css::tw.css is stale. Rebuild with the command in webapp/templates/base.html and commit the result."
            exit 1
          }

      - name: Django checks
        run: python manage.py check && python manage.py makemigrations --check --dry-run

      - name: Collectstatic (whitenoise manifest build gate)
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python -m pytest tests/ -v

  smoke-pg:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/smoke_pg_django.py
