name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Django checks
        run: python manage.py check && python manage.py makemigrations --check --dry-run

      - name: Collectstatic (whitenoise manifest build gate)
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python -m pytest tests/ -v

  smoke-pg:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/smoke_pg_django.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cim-analyst .

      - name: Verify container starts
        run: |
          docker run -d --name test-cim -p 8501:8501 cim-analyst
          sleep 10
          curl -sf http://localhost:8501/_stcore/health || exit 1
          docker stop test-cim
